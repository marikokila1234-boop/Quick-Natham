
name: QUICK NATHAM Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Configure Firebase Android
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if settings.exists() and app.exists():
              s = settings.read_text()
              a = app.read_text()
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )
              a = a.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )
              settings.write_text(s)
              app.write_text(a)
          else:
              settings = Path("android/settings.gradle")
              app = Path("android/app/build.gradle")
              s = settings.read_text()
              a = app.read_text()
              s = s.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                  1
              )
              a = a.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1
              )
              settings.write_text(s)
              app.write_text(a)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUICK-NATHAM-APK
          path: build/app/outputs/flutter-apk/app-release.apk
